  # ───────────── @@YEAR@@ edition (generated by scripts/new-edition.mjs) ─────────────
  - name: pages_@@YEAR@@
    label: "@@YEAR@@ · Page content"
    label_singular: "Page"
    editor: { preview: false }
    media_folder: /src/assets/images/editions/@@YEAR@@
    public_folder: /assets/images/editions/@@YEAR@@
    files:
      - name: event
        label: "Event details (name, date, place, prices)"
        file: src/_data/editions/@@YEAR@@/event.json
        fields:
          - { name: menu_label, label: "Name in the Events menu (e.g. March @@YEAR@@)", widget: string, required: false }
          - { name: status, label: "Status (planned = \"details coming soon\" banner; published = upcoming; past = already happened)", widget: select, options: [planned, published, past], default: planned, required: false }
          - { name: title, label: "Edition title", widget: string, required: false }
          - { name: subtitle, label: "Subtitle", widget: string, required: false }
          - { name: description, label: "Search-engine description", widget: text, required: false }
          - { name: logo, label: "Edition logo (optional)", widget: image, required: false }
          - { name: contact_email, label: "Contact email", widget: string, required: false }
          - { name: date, label: "Date", widget: string, required: false }
          - { name: time, label: "Event time", widget: string, required: false }
          - { name: checkin, label: "Check-in time", widget: string, required: false }
          - { name: location_name, label: "Venue (institution)", widget: string, required: false }
          - { name: location_detail, label: "Building", widget: string, required: false }
          - { name: location_room, label: "Room / floor", widget: string, required: false }
          - { name: location_address, label: "Address", widget: string, required: false }
          - { name: parking_garage_name, label: "Parking garage name", widget: string, required: false }
          - { name: parking_garage_address, label: "Parking garage address", widget: string, required: false }
          - { name: street_parking, label: "Street parking note", widget: string, required: false }
          - name: lodging
            label: "Lodging"
            widget: list
            required: false
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: "Hotel", widget: string, required: false }
              - { name: distance, label: "Distance", widget: string, required: false }
              - { name: address, label: "Address", widget: string, required: false }
          - name: registration
            label: "Registration"
            widget: object
            required: false
            fields:
              - { name: url, label: "Registration link", widget: string, required: false }
              - { name: button_label, label: "Button text", widget: string, required: false }
              - name: prices
                label: "Ticket prices"
                widget: list
                required: false
                summary: "{{fields.label}}: {{fields.amount}}"
                fields:
                  - { name: label, label: "Ticket type", widget: string, required: false }
                  - { name: amount, label: "Price", widget: string, required: false }

      - name: speakers_page
        label: "Speakers page text"
        file: src/_data/editions/@@YEAR@@/speakers.json
        fields:
          - { name: title, label: "Page title", widget: string, required: false }
          - { name: tagline, label: "Tagline", widget: string, required: false }
          - { name: closing, label: "Closing line", widget: string, required: false }

      - name: home
        label: "Home page"
        file: src/_data/editions/@@YEAR@@/home.json
        fields:
          - { name: headline_line1, label: "Headline (red, line 1)", widget: string, required: false }
          - { name: headline_line2, label: "Headline (black, line 2)", widget: string, required: false }
          - { name: overview_title, label: "Overview heading", widget: string, required: false }
          - { name: focus_areas_title, label: "Focus areas heading", widget: string, required: false }
          - { name: focus_areas, label: "Focus areas", widget: list, field: { name: area, label: Area, widget: string }, required: false }
          - { name: attend_title, label: "“Who should attend” heading", widget: string, required: false }
          - { name: attend_intro, label: "“Who should attend” intro", widget: string, required: false }
          - name: audiences
            label: "Audiences & takeaways"
            widget: list
            required: false
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: "Audience", widget: string, required: false }
              - { name: takeaways, label: "Takeaways", widget: list, field: { name: takeaway, label: Takeaway, widget: string }, required: false }
          - { name: hosts_title, label: "Hosts section heading", widget: string, required: false }
          - { name: hosted_by_label, label: "“Hosted by” label", widget: string, required: false }
          - { name: sponsors_label, label: "Sponsors label", widget: string, required: false }
          - { name: sponsors_link_label, label: "Sponsors button text", widget: string, required: false }
          - { name: organizers_blurb, label: "Organizers blurb", widget: text, required: false }
          - { name: organizers_link_label, label: "Organizers button text", widget: string, required: false }
          - { name: closing_cta, label: "Closing call to action", widget: string, required: false }

      - name: schedule
        label: "Schedule / agenda"
        file: src/_data/editions/@@YEAR@@/schedule.json
        fields:
          - { name: title, label: "Page title", widget: string, required: false }
          - { name: tagline, label: "Tagline", widget: string, required: false }
          - { name: low_sensory, label: "Low-sensory room notice", widget: string, required: false }
          - name: items
            label: "Agenda items (in time order)"
            label_singular: "agenda item"
            widget: list
            required: false
            summary: "{{fields.start}} {{fields.title}}{{fields.label}}"
            fields:
              - { name: kind, label: "Item kind", widget: select, options: [{ label: "Session", value: "" }, { label: "Break / meal bar", value: break }], required: false, default: "" }
              - { name: label, label: "Break text (only for breaks, e.g. Break 9:30 - 9:45)", widget: string, required: false }
              - { name: start, label: "Start time (e.g. 9:45am)", widget: string, required: false }
              - { name: end, label: "End time", widget: string, required: false }
              - { name: type, label: "Type (Panel, Breakout, Keynote...)", widget: string, required: false }
              - { name: title, label: "Title", widget: string, required: false }
              - { name: speakers_label, label: "Speaker label (Speaker / Panelists)", widget: string, required: false }
              - { name: speakers, label: "Speakers (comma-separated)", widget: string, required: false }
              - { name: moderator, label: "Moderator", widget: string, required: false }
              - { name: description, label: "Description", widget: text, required: false }

      - name: sponsors
        label: "Sponsors"
        file: src/_data/editions/@@YEAR@@/sponsors.json
        fields:
          - { name: title, label: "Page title", widget: string, required: false }
          - { name: tagline, label: "Tagline", widget: string, required: false }
          - { name: intro, label: "Intro paragraph", widget: text, required: false }
          - { name: cta, label: "“Become a sponsor” text (email address is added automatically)", widget: string, required: false }
          - { name: thanks, label: "Thank-you line", widget: string, required: false }
          - name: tiers
            label: "Sponsorship tiers"
            widget: list
            required: false
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: "Tier name", widget: string, required: false }
              - name: sponsors
                label: "Sponsors"
                widget: list
                required: false
                summary: "{{fields.name}}"
                fields:
                  - { name: name, label: "Name (used as image alt text)", widget: string, required: false }
                  - { name: logo, label: "Logo", widget: image, required: false }
                  - { name: url, label: "Website (optional)", widget: string, required: false }

      - name: organizers_page
        label: "Organizers page text & hosts"
        file: src/_data/editions/@@YEAR@@/organizers.json
        fields:
          - { name: title, label: "Page title", widget: string, required: false }
          - { name: tagline, label: "Tagline", widget: string, required: false }
          - { name: intro, label: "Intro paragraphs", widget: list, field: { name: paragraph, label: Paragraph, widget: text }, required: false }
          - { name: mission_title, label: "Mission heading", widget: string, required: false }
          - name: mission
            label: "Mission items"
            widget: list
            required: false
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: "Title", widget: string, required: false }
              - { name: text, label: "Description", widget: text, required: false }
          - { name: hosts_title, label: "Hosts heading", widget: string, required: false }
          - { name: network_title, label: "Network heading", widget: string, required: false }

      - name: hosts
        label: "Host organizations"
        file: src/_data/editions/@@YEAR@@/hosts.json
        fields:
          - name: hosts
            label: "Hosts"
            widget: list
            required: false
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: "Name", widget: string, required: false }
              - { name: subtitle, label: "Subtitle", widget: string, required: false }
              - { name: url, label: "Website", widget: string, required: false }
              - { name: logo, label: "Logo", widget: image, required: false }
              - { name: description, label: "Description", widget: text, required: false }

  - name: speakers_@@YEAR@@
    label: "@@YEAR@@ · Speakers"
    label_singular: "Speaker"
    folder: src/editions/@@YEAR@@/speakers
    extension: md
    format: yaml-frontmatter
    create: true
    slug: "{{slug}}"
    identifier_field: name
    summary: "{{name}} — {{session}}"
    sortable_fields: [order, name]
    view_groups:
      - { label: Session, field: session }
    fields:
      - { name: name, label: "Name", widget: string }
      - { name: title, label: "Job title & organization", widget: string }
      - { name: session, label: "Session heading (speakers with the same text are grouped)", widget: string }
      - { name: session_role, label: "Role in session", widget: select, options: ["", Panelist, Moderator], required: false, default: "" }
      - { name: photo, label: "Photo", widget: image, required: false, media_folder: /src/assets/images/editions/@@YEAR@@/people, public_folder: /assets/images/editions/@@YEAR@@/people }
      - { name: order, label: "Display order (1 = first)", widget: number, value_type: int, min: 1 }
      - { name: body, label: "Biography", widget: markdown }

  - name: organizers_@@YEAR@@
    label: "@@YEAR@@ · Organizers"
    label_singular: "Organizer"
    folder: src/editions/@@YEAR@@/organizers
    extension: md
    format: yaml-frontmatter
    create: true
    slug: "{{slug}}"
    identifier_field: name
    summary: "{{name}} — {{title}}"
    sortable_fields: [order, name]
    fields:
      - { name: name, label: "Name", widget: string }
      - { name: title, label: "Job title & organization", widget: string }
      - { name: photo, label: "Photo", widget: image, required: false, media_folder: /src/assets/images/editions/@@YEAR@@/people, public_folder: /assets/images/editions/@@YEAR@@/people }
      - { name: order, label: "Display order (1 = first)", widget: number, value_type: int, min: 1 }
      - { name: body, label: "Biography", widget: markdown }

