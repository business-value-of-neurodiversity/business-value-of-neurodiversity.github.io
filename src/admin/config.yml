  - name: speakers_2027
    label: "2027 · Speakers"
    label_singular: "Speaker"
    folder: src/editions/2027/speakers
    extension: md
    format: yaml-frontmatter
    create: true
    slug: "{{slug}}"
    identifier_field: name
    summary: "{{name}} — {{session}}"
    sortable_fields: [order, name]
    view_groups:
      - { label: Session, field: session }
    fields:
      - { name: name, label: "Name", widget: string }
      - { name: title, label: "Job title & organization", widget: string }
      - { name: session, label: "Session heading (speakers with the same text are grouped)", widget: string }
      - { name: session_role, label: "Role in session", widget: select, options: ["", Panelist, Moderator], required: false, default: "" }
      - { name: photo, label: "Photo", widget: image, required: false, media_folder: /src/assets/images/editions/2027/people, public_folder: /assets/images/editions/2027/people }
      - { name: order, label: "Display order (1 = first)", widget: number, value_type: int, min: 1 }
      - { name: body, label: "Biography", widget: markdown }

  - name: organizers_2027
    label: "2027 · Organizers"
    label_singular: "Organizer"
    folder: src/editions/2027/organizers
    extension: md
    format: yaml-frontmatter
    create: true
    slug: "{{slug}}"
    identifier_field: name
    summary: "{{name}} — {{title}}"
    sortable_fields: [order, name]
    fields:
      - { name: name, label: "Name", widget: string }
      - { name: title, label: "Job title & organization", widget: string }
      - { name: photo, label: "Photo", widget: image, required: false, media_folder: /src/assets/images/editions/2027/people, public_folder: /assets/images/editions/2027/people }
      - { name: order, label: "Display order (1 = first)", widget: number, value_type: int, min: 1 }
      - { name: body, label: "Biography", widget: markdown }

